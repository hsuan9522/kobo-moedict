name: Deploy dictionary preview

on:
    push:
        branches: [master]
        paths:
            - "demo/**"
            - ".github/workflows/pages.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Configure Pages
              uses: actions/configure-pages@v5
            - name: Upload preview
              uses: actions/upload-pages-artifact@v4
              with:
                  path: demo
            - name: Deploy Pages
              id: deployment
              uses: actions/deploy-pages@v4
